# Spec for ~/video-readme-maker:  python3 ~/video-readme-maker/vrm.py all README.spec.yml
# Numbers come from results/*.jsonl and configs/baselines_v2.json via tools/readme_data.py.
project:
  name: Neurosurgeon-Bench
  emoji: "🧠"
  tagline: "Can an LLM write and edit neural-network weights directly, with no gradients and no training?"
  repo: Bobliuuu/neurosurgeon-bench
hero:
  title: Neurosurgeon-Bench
  subtitle: "hand-written weights · sparse weight surgery · neuron steering"
  chips: [Track W write, Track E edit, Track S steer, no gradients]
theme: {accent: "#27c8e8", accent2: "#ff6b6b", accent3: "#f2c14e", good: "#3ddc97"}
readme_out: README.md
assets_dir: assets
badges:
  - {label: tracks, message: "W · E · S", color: 27c8e8}
  - {label: write round 1, message: "{{ n.w1_models }} models scored", color: 3ddc97}
  - {label: top index, message: "{{ n.w1_top }}", color: f2c14e}
  - {label: release, message: v0.1.0, color: 27c8e8, logo: github, link: "https://github.com/Bobliuuu/neurosurgeon-bench/releases/tag/v0.1.0"}
  - {label: Hugging Face, message: "results dataset", color: ffd21e, logo: huggingface, link: "https://huggingface.co/datasets/Bobliu/neurosurgeon-bench"}
  - {label: python, message: "3.10+", color: 3776ab, logo: python}
  - {label: license, message: MIT, color: f2c14e, link: LICENSE}
