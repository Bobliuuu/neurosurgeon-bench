numbers:
  w1_models: {file: results/derived/readme_data.json, path: w1_models}
  w1_top: {file: results/derived/readme_data.json, path: w1_top, fmt: "{:.1f}"}
  w1_ge50: {file: results/derived/readme_data.json, path: w1_ge50}
  w1_zero: {file: results/derived/readme_data.json, path: w1_zero}
  w1_median: {file: results/derived/readme_data.json, path: w1_median, fmt: "{:.1f}"}
  w1_cp40: {file: results/derived/readme_data.json, path: w1_cartpole_ge40}
  w1_mc40: {file: results/derived/readme_data.json, path: w1_mountaincar_ge40}
  w1_ca40: {file: results/derived/readme_data.json, path: w1_catch_ge40}
  w2_models: {file: results/derived/readme_data.json, path: w2_models}
  w2_tasks: {file: results/derived/readme_data.json, path: w2_tasks}
  w2_top: {file: results/derived/readme_data.json, path: w2_top, fmt: "{:.1f}"}
