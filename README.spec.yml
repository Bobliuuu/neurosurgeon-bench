  e_full: {file: results/derived/readme_data.json, path: e_full}

intro: |
  <a id="video"></a>
  Neurosurgeon-Bench asks whether a language model can **write** and **edit** neural-network weights directly: no gradient steps, no training, no code execution.
  It is inspired by "Weight-Space Programming" (Writing Weights Index) and by neuron-level steering of open-weight models.
  A reference policy found by CEM (not PPO, so the repo stays dependency-light) sets the 50-point mark; random weights set the floor.

  > **What is measured so far.** Track W round 1 scored **{{ n.w1_models }} models** on three control games and the best index is **{{ n.w1_top }}**
  > (matching the reference is 50, random is 0). A pilot of the harder v2 games and of Track E is run on 6 models each. **Track S (neuron steering) has code but no result files yet.**

video:
  url: ""
  caption: "Explainer video (voice-over and subtitles): the tracks, how scoring works, and what the pilots show"
  mp4: video/neurosurgeon_explainer.mp4
  gif: video/preview.gif
  srt: video/neurosurgeon_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  poster_at: 40
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.2}
  scenes:
    - type: title
      title: Neurosurgeon-Bench
      subtitle: "Can an LLM write and edit neural-network weights?"
      chips: [no gradients, no training, three tracks]
      say: "Neurosurgeon Bench. Can a language model write, or surgically edit, the weights of a neural network directly, with no gradients and no training? This is a short tour of the benchmark and what it shows so far."
    - type: problem
      heading: "The question"
      bullets:
        - "Models write code. Can they write weights?"
        - "Track W: hand-write every weight of a tiny MLP"
        - "Track E: repair a policy with at most 10 edits"
        - "Track S: steer an open model by editing neurons"
      say: "Models are good at writing code. Can they write weights? Track W asks a model to hand write every weight of a tiny network. Track E gives it a corrupted policy and lets it make at most ten edits. Track S asks it to steer an open weight model by editing individual neurons."
    - type: architecture
      diagram: flow
      heading: "How a run is scored"
      say: "The model sees a task description and replies with numbers. The harness loads them into a small MLP, runs the game with no further learning, and compares the score to a random floor and a C E M reference. Matching the reference scores fifty, random scores zero."
    - type: chart
      chart: hist
      say: "Track W, round one, scored {{ n.w1_models }} models on three games: cart pole, mountain car and catch. The median index is {{ n.w1_median.numtext }}. {{ n.w1_ge50.numtext }} models reach fifty or more, meaning they match the reference, and {{ n.w1_zero.numtext }} score zero."
    - type: chart
      chart: top10
      say: "The best models cluster just above fifty. The top index is {{ n.w1_top.numtext }}. On the three easy games, the ceiling is simply the reference."
    - type: results
      heading: "Round 1: models scoring 40 or more per game"
      items:
        - {label: "CartPole", number: w1_cp40}
        - {label: "MountainCar", number: w1_mc40}
        - {label: "Catch", number: w1_ca40}
      say: "Per game, {{ n.w1_cp40.numtext }} models reach forty or more on cart pole, {{ n.w1_mc40.numtext }} on mountain car, and {{ n.w1_ca40.numtext }} on catch. Hand written weights are within reach for many models on easy control tasks."
    - type: chart
      chart: hard
      say: "The harder v2 tasks separate models. In a pilot of {{ n.w2_models.numtext }} models over {{ n.w2_tasks.numtext }} tasks, only two models score well on pong, pendulum and an eight bit parity circuit; the best overall index is {{ n.w2_top.numtext }}."
    - type: chart
      chart: edit
      say: "Track E, sparse weight editing: six weights of a trained policy are corrupted and the model may make ten edits. Of the pilot models, two achieve full recovery on cart pole, and one also on catch. Pong and pendulum are not recovered."
    - type: caveats
      heading: "Honest caveats"
      bullets:
        - "Pilots use 6 models and a single sample each"
        - "Reference is CEM, not PPO: not comparable to the original index"
        - "Track S has code, but no result files yet"
        - "An index of 0 means no better-than-random weights were scored"
      say: "Caveats. The v2 and edit results are pilots of six models, one sample each. The reference is C E M, so the index is not comparable to the original P P O based one. Track S has code but no results yet. And an index of zero means no better than random weights were scored."
    - type: end
      title: Neurosurgeon-Bench
      subtitle: "Code, configs and results are in the repo"
      say: "Code, configs and results are in the repo."

